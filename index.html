<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinePanel</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="header_div">
            <img src="assets/main_icon.png" class="header_icon" alt="">
            <h1 class="header_main">MinePanel</h1>
        </div>
        
        <div class="header_text">
            <p>Панель управления</p>
            <p>Minecraft-сервером</p>
        </div>
        <div>
            <p class="header_admin">
                Администратор
            </p>
        </div>
    </header>

    <main class="main">
        <aside class="acide">
            <ul class="acide_ul">
                <li class="acide_li">
                    <img src="assets/main-menu.png" class="acide_icon" alt="">
                    <a href="#">Обзор</a>
                </li>
                <li class="acide_li">
                    <img src="assets/people.png" class="acide_icon" alt="">
                    <a href="#">Игроки</a>
                </li>
                <li class="acide_li">
                    <img src="assets/console.png" class="acide_icon" alt="">
                    <a href="#">Консоль</a>
                </li>
                <li class="acide_li">
                    <img src="assets/copies.png" class="acide_icon" alt="">
                    <a href="#">Копии</a>
                </li>
                <li class="acide_li">
                    <img src="assets/settings.png" class="acide_icon" alt="">
                    <a href="#">Настройки</a>
                </li>
            </ul>
        </aside>
        <div class="main_div">
            <h2 class="header_main"> 
                Обзор сервера
            </h2>
            <div class="main_panel">
                <div class="main_panel_icon_div">
                    <img src="assets/main_icon.png" class="main_panel_icon" alt="">
                </div>
                <div class="main_panel_text">
                    <h2>
                        Survival Server
                    </h2>
                    <p>
                        Minecraft Vanilla 1.21.3
                    </p>
                    <p class="main_panel_text_status-active" id = "serverStatus">
                        Online
                    </p>
                </div>
                <div class="main_panel_buttons">
                    <button class="main_panel_buttons_start" id = "startButton">
                        <img src="assets/start_server.png" class="main_panel_buttons_icon" alt="">
                        <p>Запустить</p>
                    </button>
                    <button class="main_panel_buttons_stop" id="stopButton">
                        <img src="assets/stop_server.png" class="main_panel_buttons_icon" alt="">
                        <p>Стоп</p>
                    </button>
                    <button class="main_panel_buttons_restart" id="restartButton">
                        <img src="assets/restart.png" class="main_panel_buttons_icon_restart" alt="">
                        <p>Рестарт</p>
                    </button>
                </div>
            </div>
            <div class="main_panel_info">
                <div class="main_panel_info_card">
                    <div class="main_panel_info_card_header">
                        <img src="assets/people.png" class="main_panel_info_card_icon" alt="">
                        <p class="main_panel_info_card_header_text">Игроки</p>
                    </div>
                        <p class="main_panel_info_card_text" id="playerCount">
                            3 / 20
                        </p>
                        <div class="main_panel_info_card_progress">
                            <div class="main_panel_info_card_progress_bar" id="playerProgressBar"></div>
                        </div>
                    </div>
                    <div class="main_panel_info_card">
                        <div class="main_panel_info_card_header">
                            <img src="assets/CPU.png" class="main_panel_info_card_icon" alt="">
                            <p class="main_panel_info_card_header_text">CPU</p>
                        </div>
                        <p class="main_panel_info_card_text" id="cpuUsage">
                            24%
                        </p>
                        <div class="main_panel_info_card_progress">
                            <div class="main_panel_info_card_progress_bar" id="cpuProgressBar"></div>
                        </div>
                    </div>
                    <div class="main_panel_info_card">
                        <div class="main_panel_info_card_header">
                            <img src="assets/RAM.png" class="main_panel_info_card_icon" alt="">
                            <p class="main_panel_info_card_header_text">RAM</p>
                        </div>
                        <p class="main_panel_info_card_text" id ="ramUsage">
                            3.2 / 8 GB
                        </p>
                        <div class="main_panel_info_card_progress">
                            <div class="main_panel_info_card_progress_bar" id="ramProgressBar"></div>
                        </div>
                    </div>
                    <div class="main_panel_info_card">
                        <div class="main_panel_info_card_header">
                            <img src="assets/speed.png" class="main_panel_info_card_icon" alt="">
                            <p class="main_panel_info_card_header_text">TPS</p>
                        </div>
                        <p class="main_panel_info_card_text" id ="tpsValue">
                            20.0
                        </p>
                        <div class="main_panel_info_card_progress">
                            <div class="main_panel_info_card_progress_bar" id="tpsProgressBar"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        
    </main>

    <footer>

    </footer>
</body>
</html>
